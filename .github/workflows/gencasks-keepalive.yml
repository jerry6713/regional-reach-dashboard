name: GEN C ASKS keep-alive

on:
  schedule:
    # Every 5 minutes (UTC); GitHub schedules may still be delayed or skipped.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen-c-asks-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping GEN C ASKS homepage
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep Render free web service awake
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 120 \
            --retry 2 --retry-delay 4 --retry-all-errors \
            --output /dev/null \
            --write-out 'GEN C ASKS HTTP %{http_code}\n' \
            'https://gencasks.genchange.ph/'
