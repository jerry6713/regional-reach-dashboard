name: GEN C ASKS keep-alive

on:
  schedule:
    # Every 10 minutes, offset from the hour to reduce GitHub scheduling delays.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gen-c-asks-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping GEN C ASKS homepage
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep Render free web service awake
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 120 \
            --retry 2 --retry-delay 4 --retry-all-errors \
            --output /dev/null \
            --write-out 'GEN C ASKS HTTP %{http_code}\\n' \
            'https://gencasks.genchange.ph/'
